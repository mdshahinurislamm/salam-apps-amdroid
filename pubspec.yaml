name: bilingual_pdf_app
description: Registration, Login, and bilingual PDF dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP client — pure Dart, no native registration needed
  dio: ^5.4.0

  # Real, drag-driven book page-flip animation (as requested)
  page_flip: ^0.2.5+1

  # Rasterizes PDF pages to images for the flip widget (pure Dart/pdfium, no license needed)
  printing: ^5.14.3

  # Core PDF library (no UI) — used only for text search across pages
  syncfusion_flutter_pdf: ^32.2.9

  # intl for localization
  intl: ^0.20.0

  # REMOVED: path_provider        → replaced with MethodChannel getCacheDir
  # REMOVED: flutter_secure_storage → replaced with MethodChannel file-based storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
