name: bilingual_pdf_app
description: Registration, Login, and bilingual PDF dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP client — pure Dart, no native registration needed
  dio: ^5.4.0

  # PDF viewer — the only native plugin we truly need
  flutter_pdfview: ^1.3.2

  # intl for localization
  intl: ^0.20.0

  # REMOVED: path_provider        → replaced with MethodChannel getCacheDir
  # REMOVED: flutter_secure_storage → replaced with MethodChannel file-based storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
